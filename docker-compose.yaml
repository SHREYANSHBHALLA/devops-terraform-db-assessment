services:
  postgres:
    image: postgres:16
    container_name: hotel-postgres
    environment:
      POSTGRES_DB: hotel_booking
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d hotel_booking"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: